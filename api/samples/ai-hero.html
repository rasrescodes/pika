<!doctype html>
<html><head><meta charset="utf-8"><title>Flowly</title>
<style>
body{width:1280px;height:720px;margin:0;overflow:hidden;font-family:Inter,system-ui,sans-serif;background:linear-gradient(135deg,#1e1b4b,#6d28d9 60%,#a855f7);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center}
.wrap{max-width:860px}
.pill{display:inline-block;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);font-size:12px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:24px}
h1{font-size:64px;line-height:1.1;margin:0 0 20px;background:linear-gradient(90deg,#fff,#c4b5fd,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent}
p{font-size:20px;color:rgba(255,255,255,.7);margin:0 auto 36px;max-width:640px}
.cta{display:inline-block;padding:16px 32px;border-radius:12px;background:#a855f7;color:#fff;font-weight:600;box-shadow:0 0 40px #a855f7}
.cards{display:flex;gap:16px;justify-content:center;margin-top:48px}
.card{backdrop-filter:blur(12px);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-left:4px solid #67e8f9;border-radius:16px;padding:16px 20px;font-size:13px;color:#cbd5e1;box-shadow:0 20px 40px rgba(0,0,0,.3)}
</style></head>
<body><div class="wrap">
<span class="pill">Introducing Flowly 2.0</span>
<h1>Supercharge your workflow with seamless AI automation</h1>
<p>Unlock next-generation productivity. Flowly empowers teams to elevate every process with cutting-edge, enterprise-grade intelligence.</p>
<a class="cta" href="#">Get started free</a>
<div class="cards"><div class="card">⚡ 10x faster</div><div class="card">🔒 Secure by default</div><div class="card">✨ AI-powered</div></div>
</div></body></html>
