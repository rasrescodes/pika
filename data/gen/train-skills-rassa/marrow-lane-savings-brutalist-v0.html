<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Marrow Lane Savings</title>
<style>
*{box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;margin:0;background:#F4F7F5;color:#0F2A24;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;position:relative}
.f{position:absolute;left:64px;top:48px;width:1152px;height:624px;border:2px solid #0F2A24;display:grid;grid-template-columns:2fr 1fr;grid-template-rows:56px 1fr 176px}
.h,.m,.b{display:flex;min-width:0}
.c{border-right:2px solid #0F2A24;border-bottom:2px solid #0F2A24;display:flex;align-items:center;padding:0 24px}
.c:last-child,.r{border-right:0}
.l{font-size:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.brand{flex:1;font-size:16px;font-weight:700;letter-spacing:0}
.hs{flex:0 0 192px}
.hl{flex:0 0 192px;border-right:0}
.main{border-right:2px solid #0F2A24;border-bottom:2px solid #0F2A24;padding:40px;display:flex;align-items:flex-end}
h1{margin:0;font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:104px;line-height:.95;letter-spacing:-.025em;text-wrap:balance}
h1 span{color:#0F6B57}
.art{position:relative;border-bottom:2px solid #0F2A24}
.art svg{position:absolute;right:-64px;top:0;display:block}
.sub{flex:0 0 480px;border-right:2px solid #0F2A24;border-top:0;padding:32px 40px;display:flex;align-items:center}
p{margin:0;font-size:20px;line-height:1.5;text-wrap:pretty;max-width:44ch}
.act{flex:1;display:flex;align-items:center;padding:0 32px;border-right:2px solid #0F2A24}
.btn{display:flex;align-items:center;height:56px;padding:0 24px;background:#0F6B57;color:#F4F7F5;font-size:18px;font-weight:700;letter-spacing:0;white-space:nowrap}
.fx{display:grid;grid-template-rows:repeat(3,1fr)}
.fx div{display:flex;justify-content:space-between;align-items:center;padding:0 24px;border-bottom:2px solid #0F2A24}
.fx div:last-child{border-bottom:0}
.fx .l{opacity:.7}
.fx b{font-size:18px}
</style></head><body>
<div class="f">
  <div class="c brand">Marrow Lane Savings</div>
  <div class="h" style="border-bottom:2px solid #0F2A24">
    <div class="c l hs" style="border-bottom:0;flex:1">Member-owned</div>
    <div class="c l" style="border-bottom:0;border-right:0;flex:0 0 128px">Cardiff</div>
  </div>
  <div class="main"><h1>Savings that stay <span>simple</span></h1></div>
  <div class="art">
    <svg width="446" height="392" viewBox="0 0 446 392" fill="none" stroke="#0F2A24" stroke-width="2">
      <path d="M446 392V104A288 288 0 0 0 158 392Z" fill="#0F6B57" stroke="none"/>
      <path d="M446 392V40A352 352 0 0 0 94 392Z"/>
    </svg>
  </div>
  <div class="b" style="border-right:0">
    <div class="sub" style="border-top:0"><p>A member-owned savings society in Cardiff with one account, clear rates and no small print.</p></div>
    <div class="act"><a class="btn">Open an account</a></div>
  </div>
  <div class="fx">
    <div><span class="l">Account</span><b>One</b></div>
    <div><span class="l">Rates</span><b>Clear</b></div>
    <div><span class="l">Small print</span><b>None</b></div>
  </div>
</div>
</body></html>
