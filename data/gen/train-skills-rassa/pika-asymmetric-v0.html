<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Pika</title>
<style>
:root{--bg:#FBF5EA;--ink:#0A0A0A;--ac:#3027F4}
*{box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;margin:0;background:var(--bg);color:var(--ink);font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;position:relative}
.logo{position:absolute;left:64px;top:56px;font-size:24px;font-weight:700;letter-spacing:-0.02em;margin:0}
.copy{position:absolute;left:64px;top:168px;width:660px}
h1{font-size:92px;line-height:0.96;letter-spacing:-0.03em;font-weight:700;margin:0;text-wrap:balance}
h1 em{font-style:normal;color:var(--ac)}
h2{font-size:20px;line-height:1.5;font-weight:400;letter-spacing:0;margin:32px 0 0;max-width:46ch;text-wrap:pretty;opacity:.78}
.btn{display:inline-flex;align-items:center;height:56px;padding:0 32px;margin-top:48px;background:var(--ink);color:var(--bg);font-size:18px;font-weight:700;letter-spacing:-0.01em;border-radius:8px;text-decoration:none}
.note{position:absolute;left:64px;bottom:48px;font-size:16px;line-height:1.45;margin:0;opacity:.7}
.wall{position:absolute;left:768px;top:88px;display:grid;grid-template-columns:repeat(3,176px);grid-auto-rows:216px;gap:16px}
.wall svg{display:block;width:176px;height:216px;border-radius:8px}
.wall svg:nth-child(3n+2){transform:translateY(-64px)}
.i{fill:var(--ink)}.c{fill:var(--bg)}.a{fill:var(--ac)}
.o{fill:none;stroke:var(--ink);stroke-width:3}
.f{fill:var(--bg)}
</style></head><body>
<p class="logo">Pika</p>
<main class="copy">
<h1>An art director that learns your <em>taste</em></h1>
<h2>Generate a wall of designs. Overrule the Juror once. Watch the next batch come back your way.</h2>
<a class="btn" href="#">Generate a wall</a>
</main>
<p class="note">A quiet companion for the ideas you are still shaping.</p>
<div class="wall" aria-hidden="true">
<svg viewBox="0 0 176 216"><rect class="i" width="176" height="216"/><circle class="c" cx="88" cy="108" r="56"/></svg>
<svg viewBox="0 0 176 216"><rect class="f" width="176" height="216"/><rect class="o" x="1.5" y="1.5" width="173" height="213" rx="7"/><path class="i" d="M0 216V64a152 152 0 0 1 152 152z"/></svg>
<svg viewBox="0 0 176 216"><rect class="f" width="176" height="216"/><rect class="o" x="1.5" y="1.5" width="173" height="213" rx="7"/><rect class="i" x="32" y="40" width="112" height="24"/><circle class="i" cx="124" cy="148" r="28"/></svg>
<svg viewBox="0 0 176 216"><rect class="a" width="176" height="216"/><path class="c" d="M32 176V88a56 56 0 0 1 112 0v88z"/></svg>
<svg viewBox="0 0 176 216"><rect class="i" width="176" height="216"/><path class="c" d="M24 152a64 64 0 0 1 128 0z"/></svg>
<svg viewBox="0 0 176 216"><rect class="f" width="176" height="216"/><rect class="o" x="1.5" y="1.5" width="173" height="213" rx="7"/><path class="i" d="M88 40L152 176H24z"/></svg>
<svg viewBox="0 0 176 216"><rect class="f" width="176" height="216"/><rect class="o" x="1.5" y="1.5" width="173" height="213" rx="7"/><path class="i" d="M32 40h24v136H32zM76 40h24v136H76zM120 40h24v136h-24z"/></svg>
<svg viewBox="0 0 176 216"><rect class="f" width="176" height="216"/><rect class="o" x="1.5" y="1.5" width="173" height="213" rx="7"/><circle class="i" cx="88" cy="108" r="24"/><circle class="o" cx="88" cy="108" r="64"/></svg>
<svg viewBox="0 0 176 216"><rect class="i" width="176" height="216"/><path class="c" d="M0 108h176v16H0z"/></svg>
</div>
</body></html>
