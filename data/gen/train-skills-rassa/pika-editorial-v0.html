<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Pika</title>
<style>
*{box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;margin:0;background:#FBF5EA;color:#0A0A0A;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;position:relative}
header{position:absolute;left:64px;right:64px;top:40px;display:flex;justify-content:space-between;align-items:baseline;padding-bottom:16px;border-bottom:2px solid #0A0A0A}
.logo{font-size:28px;font-weight:700;letter-spacing:-0.02em}
header p{margin:0;font-size:16px;line-height:1.5;opacity:.65}
h1{position:absolute;left:64px;right:64px;top:128px;margin:0;font-size:100px;line-height:.96;font-weight:700;letter-spacing:-0.03em;text-wrap:balance}
h1 span{display:block}
.cols{position:absolute;left:64px;right:64px;top:380px;display:grid;grid-template-columns:1fr 1fr 220px;gap:32px;border-top:2px solid #0A0A0A;padding-top:32px}
.cols h2{margin:0;font-size:20px;line-height:1.5;font-weight:400;letter-spacing:0;text-wrap:pretty;max-width:60ch}
.cols h2+h2{padding-left:32px;border-left:1px solid #0A0A0A}
.act{position:absolute;left:64px;top:560px}
a{display:inline-flex;align-items:center;height:56px;padding:0 32px;background:#3027F4;color:#FBF5EA;font-size:18px;font-weight:700;letter-spacing:-0.01em;text-decoration:none;border-radius:8px}
svg{position:absolute;right:0;bottom:0}
</style></head><body>
<header><span class="logo">Pika</span><p>Your taste, learned one overrule at a time.</p></header>
<h1><span>An art director</span><span>that learns your taste</span></h1>
<section class="cols">
<h2>Generate a wall of designs. Overrule the Juror once.</h2>
<h2>Watch the next batch come back your way.</h2>
<div></div>
</section>
<div class="act"><a href="#">Generate a wall</a></div>

</body></html>
