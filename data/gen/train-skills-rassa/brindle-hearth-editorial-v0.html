<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Brindle Hearth</title>
<style>
body{width:1280px;height:720px;overflow:hidden;margin:0;background:#1C1410;color:#F5E9D8;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;position:relative}

<header><b>Brindle Hearth</b><span>Leeds</span></header>
<h1><em>Fire,</em> salt and a long table</h1>
<section class="cols">
<div><h2>Wood-fired plates from a Leeds kitchen that cooks only what the market sends that morning.</h2></div>
<div><p>The menu is written once the crates arrive, so no two suppers read alike. Pull up a chair and stay a while.</p><a href="#">Book a table</a></div>
</section>
