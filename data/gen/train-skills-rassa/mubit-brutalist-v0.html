<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Mubit</title>
<style>
*{box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;margin:0;background:#d2dad1;color:#263b32;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
.mono{font-family:Menlo,'Courier New',monospace}
.frame{position:absolute;left:64px;top:40px;width:1152px;height:640px;border:2px solid #263b32;display:flex;flex-direction:column}
header{height:56px;border-bottom:2px solid #263b32;display:flex;justify-content:space-between;align-items:center;padding:0 32px;font-family:Menlo,'Courier New',monospace;font-size:14px}
header b{font-size:18px;letter-spacing:-0.01em}
header span{display:flex;gap:32px}
header span i{font-style:normal;opacity:.8}
main{flex:1;display:grid;grid-template-columns:7fr 5fr;min-height:0}
.l{border-right:2px solid #263b32;padding:48px 48px 32px;display:flex;flex-direction:column;justify-content:center}
h1{font-family:Menlo,'Courier New',monospace;font-weight:700;font-size:68px;line-height:.98;letter-spacing:-0.03em;margin:0;text-wrap:balance}
h1 em{font-style:normal;color:#d9421d}
.r{position:relative}
.r svg{position:absolute;left:0;top:0;width:calc(100% + 64px);height:100%}
.tag{position:absolute;font-family:Menlo,'Courier New',monospace;font-size:14px;letter-spacing:.06em}
.bottom{height:136px;border-top:2px solid #263b32;display:grid;grid-template-columns:7fr 5fr}
.bottom .a{border-right:2px solid #263b32;padding:0 48px;display:flex;align-items:center}
h2{margin:0;font-weight:400;font-size:20px;line-height:1.5;max-width:44ch;text-wrap:pretty}
.bottom .b{padding:0 32px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.note{font-family:Menlo,'Courier New',monospace;font-size:14px;line-height:1.5;opacity:.8}
a{display:inline-flex;align-items:center;height:56px;padding:0 24px;background:#263b32;color:#d2dad1;font-family:Menlo,'Courier New',monospace;font-size:16px;font-weight:700;text-decoration:none;white-space:nowrap}
</style></head><body>
<div class="frame">
<header><b>Mubit</b><span><i>Docs</i><i>Sign in</i></span></header>
<main>
<div class="l"><h1>The runtime calibration layer for AI <em>agents</em></h1></div>
<div class="r">
<svg viewBox="0 0 544 448" fill="none" stroke="#263b32" stroke-width="2" preserveAspectRatio="none">
<line x1="0" y1="224" x2="544" y2="224" stroke-dasharray="6 6"/>
<path d="M0 96C70 40 110 380 190 330S290 120 350 200S420 236 470 224S520 224 544 224"/>
<circle cx="350" cy="200" r="6" fill="#263b32"/>
<circle cx="470" cy="224" r="9" fill="#d9421d" stroke="none"/>
<line x1="470" y1="224" x2="470" y2="420"/>
</svg>
<span class="tag" style="left:24px;top:24px">drift to target</span>
<span class="tag" style="left:24px;bottom:24px;opacity:.8">each run narrows it</span>
</div>
</main>
<div class="bottom">
<div class="a"><h2>Your frontier models stay in place. Every run teaches the next one.</h2></div>
<div class="b"><span class="note">agent in<br>calibrated out</span><a href="#">Connect your agent</a></div>
</div>
</div>
</body></html>
