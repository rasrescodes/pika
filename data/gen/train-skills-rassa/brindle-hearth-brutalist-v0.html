<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Brindle Hearth</title>
<style>
*{box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;margin:0;background:#1C1410;color:#F5E9D8;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;position:relative}
.frame{position:absolute;left:64px;top:48px;width:1152px;height:624px;border:2px solid #F5E9D8;display:grid;grid-template-columns:768px 1fr;grid-template-rows:56px 1fr 56px}
.c{padding:0 32px;display:flex;align-items:center;font-size:14px;line-height:1.3;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.c span{opacity:.7}
.l{border-right:2px solid #F5E9D8}
.t{border-bottom:2px solid #F5E9D8}
.b{border-top:2px solid #F5E9D8}
.main{display:flex;flex-direction:column;justify-content:flex-end;padding:48px 48px 40px}
h1{margin:0;font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:108px;line-height:.95;letter-spacing:-.025em;text-wrap:balance;max-width:700px}
h1 em{font-style:normal;color:#E2733A}
.side{padding:40px 32px;display:flex;flex-direction:column;align-items:flex-start;position:relative}
h2{margin:0;font-weight:400;font-size:20px;line-height:1.5;letter-spacing:0;max-width:30ch;text-wrap:pretty}
.btn{margin-top:32px;display:inline-flex;align-items:center;height:56px;padding:0 32px;background:#E2733A;color:#1C1410;font-weight:700;font-size:16px;text-decoration:none;border:2px solid #E2733A}
.hint{margin-top:16px;font-size:14px;opacity:.7}
svg{position:absolute;right:-42px;bottom:32px}
</style></head><body>
<main class="frame">
<div class="c l t">Brindle Hearth</div>
<div class="c t"><span>Supper table</span></div>
<section class="l main"><h1>Fire, salt and a long <em>table</em></h1></section>
<section class="side">
<h2>Wood-fired plates from a Leeds kitchen that cooks only what the market sends that morning.</h2>
<a class="btn" href="#">Book a table</a>

</section>
<div class="c l b"><span>Daily market menu</span></div>
<div class="c b"><span>Leeds</span></div>
</main>
</body></html>
