<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Oddlot Atelier</title>
<style>
*{box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;margin:0;background:#FFE14D;color:#1A1A1A;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;position:relative}
.frame{position:absolute;left:64px;top:48px;width:1152px;height:624px;border:2px solid #1A1A1A;display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:840px 1fr}
.top{height:56px;border-bottom:2px solid #1A1A1A;grid-template-columns:420px 420px 1fr}
.top div{display:flex;align-items:center;padding:0 32px;border-right:2px solid #1A1A1A;font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.top div:first-child{font-size:18px;letter-spacing:-.01em;text-transform:none;font-weight:800}
.top div:last-child{border-right:0}
.main{flex:1;border-bottom:2px solid #1A1A1A}
.main .l{border-right:2px solid #1A1A1A;padding:24px 32px;display:flex;align-items:center}
h1{margin:0;font-size:124px;line-height:.95;letter-spacing:-.03em;font-weight:800;text-wrap:balance}
.main .r{position:relative;display:flex;align-items:flex-end;padding:16px}
.main .r span{font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.foot{height:128px}
.foot .l{border-right:2px solid #1A1A1A;display:flex;align-items:center;justify-content:space-between;padding:0 32px;gap:32px}
h2{margin:0;font-size:20px;line-height:1.5;font-weight:400;max-width:44ch;text-wrap:pretty}
a{display:flex;align-items:center;height:56px;padding:0 32px;background:#1A1A1A;color:#FFE14D;font-size:18px;font-weight:800;text-decoration:none;white-space:nowrap;border:2px solid #1A1A1A}
.foot .r{display:flex;align-items:center;padding:0 16px 0 32px;font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;line-height:1.4}
svg{position:absolute;left:1000px;top:174px;width:300px;height:300px}
</style></head><body>
<div class="frame">
<div class="row top"><div>Oddlot Atelier</div><div>Reclaimed fabric</div><div>Small runs</div></div>
<div class="row main"><div class="l"><h1>Clothes that<br>talk over<br>dinner</h1></div><div class="r"><span>Table for one jacket</span></div></div>
<div class="row foot"><div class="l"><h2>Bold jackets and trousers cut from reclaimed fabric in small runs in Glasgow.</h2><a href="#">Shop the drop</a></div><div class="r">Cut and sewn in Glasgow</div></div>
</div>
<svg viewBox="0 0 300 300" aria-hidden="true"><circle cx="150" cy="150" r="149" fill="#FF2E63"/><circle cx="150" cy="150" r="100" fill="none" stroke="#1A1A1A" stroke-width="2"/><circle cx="150" cy="150" r="149" fill="none" stroke="#1A1A1A" stroke-width="2"/><path d="M150 50V250M50 150H250" stroke="#1A1A1A" stroke-width="2" fill="none"/></svg>
</body></html>
