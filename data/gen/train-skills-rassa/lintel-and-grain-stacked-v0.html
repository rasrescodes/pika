<!DOCTYPE html>
<html lang="en">
<head>

<title>Lintel &amp; Grain Architects</title>
<style>
html{background:#EDEBE6}
body{width:1280px;height:720px;overflow:hidden;margin:0;position:relative;background:#EDEBE6;color:#222222;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
h1{margin:0;font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:120px;line-height:.95;letter-spacing:-.025em}

.foot{grid-column:1 / 3;align-self:end;font-size:14px;line-height:1.4;opacity:.6;display:flex;justify-content:space-between}
.lintel{position:absolute;left:1096px;top:200px}
